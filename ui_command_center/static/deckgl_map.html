<!DOCTYPE html>
<html>

<head>
  <title>Tactical Map | The Evasion Protocol</title>
  <script src="https://unpkg.com/deck.gl@latest/dist.min.js"></script>
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.14.1/mapbox-gl.css" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      font-family: 'Courier New', Courier, monospace;
    }

    #control-panel {
      position: absolute;
      top: 0;
      left: 0;
      margin: 20px;
      padding: 20px;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      z-index: 1;
      border: 1px solid #33f;
    }
  </style>
</head>

<body>
  <div id="control-panel">
    <h3>TACTICAL COMMAND</h3>
    <p>Data Source: HPC Core (GPU)</p>
    <p>Status: <span style="color: #0f0">LIVE</span></p>
  </div>
  <div id="container" style="width: 100vw; height: 100vh;"></div>

  <script type="text/javascript">
    const { DeckGL, ScatterplotLayer, ArcLayer } = deck;

    // Mock Data Generation (Simulates API response from /api/tactical-data)
    // In production, fetch() this from FastAPI
    const NODE_DATA = [];
    const ARC_DATA = [];

    const CENTER_LAT = 40.4168;
    const CENTER_LON = -3.7038;

    for (let i = 0; i < 100; i++) {
      NODE_DATA.push({
        position: [CENTER_LON + (Math.random() - 0.5) * 0.1, CENTER_LAT + (Math.random() - 0.5) * 0.1],
        risk: Math.random(), // 0 to 1
        id: `Node-${i}`
      });
    }

    // Create Arcs (Simulating GAT Attention Weights)
    for (let i = 0; i < 50; i++) {
      const source = NODE_DATA[Math.floor(Math.random() * 100)];
      const target = NODE_DATA[Math.floor(Math.random() * 100)];
      const attention = Math.random(); // Alpha weight from GAT

      ARC_DATA.push({
        source: source.position,
        target: target.position,
        attention: attention
      });
    }

    // LAYERS
    // 1. Nodes: Red = Danger, Green = Safe
    const nodeLayer = new ScatterplotLayer({
      id: 'nodes',
      data: NODE_DATA,
      getPosition: d => d.position,
      getFillColor: d => d.risk > 0.7 ? [255, 0, 0] : [57, 255, 20], // Neon Red vs Neon Green
      getRadius: d => d.risk > 0.7 ? 100 : 50,
      radiusMinPixels: 3,
      pickable: true,
      onClick: info => console.log('Node:', info.object)
    });

    // 2. Arcs (Edges): Width/Color mapped to GAT Attention
    const arcLayer = new ArcLayer({
      id: 'arcs',
      data: ARC_DATA,
      getSourcePosition: d => d.source,
      getTargetPosition: d => d.target,
      getSourceColor: d => [0, 255, 255, d.attention * 255], // Cyan
      getTargetColor: d => [255, 0, 255, d.attention * 255], // Magenta
      getWidth: d => d.attention * 5, // Thicker = High Attention (Escape Route)
      parameters: { blend: true }
    });

    new DeckGL({
      container: 'container',
      initialViewState: {
        longitude: CENTER_LON,
        latitude: CENTER_LAT,
        zoom: 12,
        pitch: 60,
        bearing: 30
      },
      controller: true,
      layers: [nodeLayer, arcLayer],
      mapStyle: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json'
    });
  </script>
</body>

</html>
