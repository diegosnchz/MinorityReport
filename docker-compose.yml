version: '3.8'

services:
  # Servicio 1: Base de Datos de Grafos
  neo4j_db:
    image: neo4j:5.16.0
    container_name: precog_neo4j
    ports:
      - "7474:7474" # HTTP (Browser)
      - "7687:7687" # Bolt (Protocolo binario)
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    volumes:
      - ./neo4j_data:/data # Persistencia de datos

  # Servicio 2: Tu API de Pre-Crimen
  precog_api:
    build: .
    container_name: precog_brain
    ports:
      - "8000:8000"
    environment:
      - NEO4J_URI=bolt://neo4j_db:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
    depends_on:
      - neo4j_db
    volumes:
      - ./app:/code/app # Hot-reload
