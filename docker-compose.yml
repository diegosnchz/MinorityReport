version: '3.8'

services:
  # Neo4j Database - Grafo de la ciudad con vigilancia
  neo4j:
    image: neo4j:5.15-community
    container_name: minority-report-neo4j
    hostname: neo4j
    ports:
      - "7474:7474"  # HTTP - Neo4j Browser
      - "7687:7687"  # Bolt Protocol
    environment:
      - NEO4J_AUTH=neo4j/minorityreport
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,gds.*
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=2G
      - NEO4J_dbms_memory_pagecache_size=1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - ./neo4j_integration.cypher:/var/lib/neo4j/import/init.cypher:ro
      - ./scripts/init-neo4j.sh:/docker-entrypoint-init.d/init-neo4j.sh:ro
    networks:
      - minority-report-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # OracleNet - El modelo de IA para escape de ladrones
  oracle-net:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oracle-net
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=minorityreport
      - CUDA_VISIBLE_DEVICES=-1  # Usar CPU en Docker (cambiar a 0 para GPU)
    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
    networks:
      - minority-report-network
    # Comando para entrenar el modelo
    command: python train_oracle.py
    # Para desarrollo, puedes usar:
    # command: tail -f /dev/null  # Mantener contenedor vivo

  # Discriminator (Police AI) - Para entrenamiento adversarial
  police-gan:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: police-gan
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=minorityreport
    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
    networks:
      - minority-report-network
    # Entrenar el GAN de la policía
    command: python train.py

  # Gossip Protocol - Red distribuida de vigilancia (Modo 1)
  gossip-network:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gossip-network
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=minorityreport
      - NETWORK_PROTOCOL=gossip  # gossip o mesh
    networks:
      - minority-report-network
    command: python gossip_protocol.py
    # Descomenta para usar Mesh en su lugar:
    # command: python mesh_network.py

  # Mesh Network - Alternativa al Gossip (Modo 2)
  # Descomenta este servicio si prefieres usar Mesh
  # mesh-network:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: mesh-network
  #   depends_on:
  #     neo4j:
  #       condition: service_healthy
  #   environment:
  #     - NEO4J_URI=bolt://neo4j:7687
  #     - NEO4J_USER=neo4j
  #     - NEO4J_PASSWORD=minorityreport
  #     - NETWORK_PROTOCOL=mesh
  #   networks:
  #     - minority-report-network
  #   command: python mesh_network.py

  # Benchmark - Comparación Gossip vs Mesh
  # Ejecutar para decidir cuál protocolo usar
  # docker-compose run --rm benchmark
  benchmark:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: protocol-benchmark
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=minorityreport
    networks:
      - minority-report-network
    command: python benchmark_protocols.py
    profiles:
      - benchmark  # No se inicia por defecto

networks:
  minority-report-network:
    driver: bridge

volumes:
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  neo4j_import:
    driver: local
