<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Pre-Crime Division | Dashboard</title>
    <script src="//unpkg.com/3d-force-graph"></script>
    <style>
        body {
            margin: 0;
            font-family: 'Courier New', monospace;
            background: #050505;
            color: #00ff00;
            overflow: hidden;
        }

        #dashboard {
            display: flex;
            height: 100vh;
        }

        #sidebar {
            width: 300px;
            border-right: 1px solid #333;
            padding: 20px;
            overflow-y: auto;
            background: #0a0a0a;
        }

        #graph-container {
            flex-grow: 1;
            position: relative;
        }

        .vision-card {
            border: 1px solid #333;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .vision-card:hover {
            border-color: #ff0000;
            background: #1a0505;
        }

        .vision-card.high-risk {
            border-left: 4px solid #ff0000;
        }

        h2 {
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
        }

        .badge {
            background: #333;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.8em;
        }
    </style>
</head>

<body>
    <div id="dashboard">
        <div id="sidebar">
            <h2>ACTIVE VISIONS</h2>
            <div id="vision-list">
                <div style="color: #666;">Scanning system...</div>
            </div>

            <div style="margin-top: 20px;">
                <button onclick="triggerSimulation()"
                    style="width: 100%; padding: 10px; background: #ff0000; color: white; border: none; cursor: pointer;">
                    RUN SIMULATION STEP
                </button>
            </div>
        </div>
        <div id="graph-container"></div>
    </div>

    <script>
        // 1. Configuración del Grafo 3D
        const Graph = ForceGraph3D()
            (document.getElementById('graph-container'))
            .jsonUrl('/visions/graph?limit=200') // Llama a nuestra API
            .nodeLabel('label')
            .nodeAutoColorBy('group')
            .nodeVal('val') // Tamaño del nodo basado en riesgo
            .linkDirectionalParticles(2) // Partículas fluyendo en las conexiones
            .linkDirectionalParticleSpeed(d => 0.005) // Fixed speed for visibility
            .onNodeClick(node => {
                // Al hacer clic, la cámara viaja al nodo
                const distance = 40;
                const distRatio = 1 + distance / Math.hypot(node.x, node.y, node.z);

                Graph.cameraPosition(
                    { x: node.x * distRatio, y: node.y * distRatio, z: node.z * distRatio },
                    node,
                    3000  // Duración del vuelo (ms)
                );
            });

        // Configuración de colores personalizada
        Graph.nodeColor(node => {
            if (node.group === 'red') return '#ff0000';   // Vision
            if (node.group === 'blue') return '#00aaff';  // Citizen
            if (node.group === 'yellow') return '#ffcc00'; // Location
            return '#ffffff';
        });

        // 2. Lógica del Sidebar (Visiones Activas)
        async function loadVisions() {
            try {
                const response = await fetch('/visions/active');
                const visions = await response.json();

                const container = document.getElementById('vision-list');
                container.innerHTML = ''; // Limpiar

                if (visions.length === 0) {
                    container.innerHTML = '<div style="color: #666;">No active threats detected.</div>';
                    return;
                }

                visions.forEach(v => {
                    const div = document.createElement('div');
                    div.className = 'vision-card high-risk';
                    div.innerHTML = `
                        <div style="font-weight: bold; color: #ff5555;">⚠ ${v.perpetrator.name}</div>
                        <div style="font-size: 0.9em;">Target: ${v.target.name}</div>
                        <div style="font-size: 0.8em; margin-top: 5px;">
                            <span class="badge">Prob: ${(v.probability * 100).toFixed(1)}%</span>
                            <span class="badge">${new Date(v.timestamp).toLocaleTimeString()}</span>
                        </div>
                    `;
                    // Al hacer clic en la tarjeta, enfocar en el nodo (si existe en el grafo actual)
                    div.onclick = () => {
                        // En un sistema real, buscaríamos el nodo por ID
                        console.log("Focusing on vision:", v.id);
                    };
                    container.appendChild(div);
                });
            } catch (e) {
                console.error("Error loading visions:", e);
            }
        }

        async function triggerSimulation() {
            try {
                await fetch('/simulation/step', { method: 'POST' });
                // Recargar datos después de simular
                loadVisions();
                // Forzar recarga del grafo (esto es un poco brusco, idealmente websockets)
                // Graph.jsonUrl('/visions/graph?limit=200'); 
                // ForceGraph doesn't auto-refresh just by calling jsonUrl again with same url usually, 
                // but for demo we can rely on page refresh or assume library handles it.
                // Let's just reload page parts or re-fetch graph data
                // Quick hack for demo: logic to refresh data
                Graph.jsonUrl('/visions/graph?limit=200&t=' + new Date().getTime());
            } catch (e) {
                console.error("Simulation failed:", e);
            }
        }

        // Cargar al inicio
        loadVisions();
        setInterval(loadVisions, 5000); // Auto-refrescar cada 5s
    </script>
</body>

</html>
