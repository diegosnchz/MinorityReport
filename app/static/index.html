<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pre-Crime Division | Dashboard</title>
    <script src="//unpkg.com/3d-force-graph"></script>
    <style>
        body {
            margin: 0;
            background-color: #000;
            color: #00ff00;
            font-family: monospace;
            overflow: hidden;
        }

        #graph-container {
            width: 100vw;
            height: 100vh;
        }

        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #00ff00;
            padding: 20px;
            width: 300px;
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 1.2em;
            text-transform: uppercase;
            border-bottom: 1px solid #00ff00;
            padding-bottom: 5px;
        }

        .vision-card {
            border: 1px solid #333;
            margin-bottom: 10px;
            padding: 10px;
            background: #0a0a0a;
            cursor: pointer;
        }

        .vision-card:hover {
            border-color: #00ff00;
        }

        .high-risk {
            color: #ff0000;
        }

        .medium-risk {
            color: #ffa500;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            font-family: monospace;
            font-weight: bold;
        }

        .btn-green {
            background: #333;
            color: #00ff00;
            border: 1px solid #00ff00;
        }

        .btn-green:hover {
            background: #004400;
        }

        .btn-red {
            background: #aa0000;
            color: white;
            border: 1px solid #ff0000;
        }

        .btn-red:hover {
            background: #ff0000;
        }

        .btn-blue {
            background: #0000aa;
            color: white;
            border: 1px solid #00aaff;
        }

        .btn-blue:hover {
            background: #00aaff;
        }
    </style>
</head>

<body>
    <div id="ui-layer">
        <h1>Active Visions</h1>
        <div id="vision-feed">
            No active threats detected.
        </div>

        <div style="margin-top: 20px;">
            <button class="btn-green" onclick="window.location.href='/analytics-dashboard'">
                VIEW ANALYTICS DIVISION
            </button>

            <button class="btn-blue" onclick="window.location.href='/map-view'">
                VIEW GEOSPATIAL MAP
            </button>

            <button class="btn-red" onclick="triggerSimulation()">
                RUN SIMULATION STEP
            </button>
        </div>
    </div>
    <div id="graph-container"></div>

    <script>
        const graphElem = document.getElementById('graph-container');
        let Graph = ForceGraph3D()(graphElem)
            .backgroundColor('#000000')
            .nodeAutoColorBy('group')
            .nodeLabel(node => `${node.label} (${node.type})`)
            .linkWidth(link => link.value > 0.5 ? 2 : 1)
            .onNodeClick(node => {
                const distance = 40;
                const distRatio = 1 + distance / Math.hypot(node.x, node.y, node.z);
                Graph.cameraPosition(
                    { x: node.x * distRatio, y: node.y * distRatio, z: node.z * distRatio },
                    node,
                    3000
                );
            });

        async function fetchGraphData() {
            try {
                const res = await fetch('/visions/graph?limit=300');
                const data = await res.json();
                Graph.graphData(data);
            } catch (e) { console.error("Error fetching graph:", e); }
        }

        async function fetchActiveVisions() {
            const feed = document.getElementById('vision-feed');
            try {
                const res = await fetch('/visions/active');
                const visions = await res.json();

                if (visions.length === 0) {
                    feed.innerHTML = "No active threats detected.";
                    return;
                }

                feed.innerHTML = visions.map(v => `
                    <div class="vision-card">
                        <div style="font-weight:bold;">${v.perpetrator.name} -> ${v.target.name}</div>
                        <div>Prob: <span class="${v.probability > 0.8 ? 'high-risk' : 'medium-risk'}">${(v.probability * 100).toFixed(1)}%</span></div>
                        <div style="font-size:0.8em; color:#888;">${new Date(v.timestamp).toLocaleTimeString()}</div>
                    </div>
                `).join('');

            } catch (e) { console.error("Error fetching visions:", e); }
        }

        async function triggerSimulation() {
            await fetch('/simulation/step', { method: 'POST' });
            fetchGraphData();
            fetchActiveVisions();
        }

        fetchGraphData();
        fetchActiveVisions();
        setInterval(fetchActiveVisions, 5000);
    </script>
</body>

</html>
