<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pre-Crime Division | Dashboard</title>
    <script src="//unpkg.com/3d-force-graph"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* STEALTH ENTERPRISE PALETTE */
            --bg-color: #000000;
            --card-bg: #121212;
            --card-border: #27272a;
            --text-primary: #e4e4e7;
            --text-secondary: #71717a;
            --accent-selection: #ffffff;
            --accent-danger: #ef4444;
            --accent-safe: #10b981;
            --mono-font: 'JetBrains Mono', monospace;
        }

        body {
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        /* CHATBOT - STEALTH STYLE */
        .chat-fab {
            position: absolute;
            bottom: 30px;
            right: 40px;
            width: 48px;
            height: 48px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            color: var(--text-primary);
            cursor: pointer;
            transition: border-color 0.2s;
            pointer-events: auto;
            z-index: 1000;
        }

        .chat-fab:hover {
            border-color: var(--accent-selection);
        }

        .chat-window {
            position: absolute;
            bottom: 90px;
            right: 40px;
            width: 320px;
            height: 450px;
            background: var(--bg-color);
            border: 1px solid var(--card-border);
            border-radius: 4px;
            display: none;
            flex-direction: column;
            pointer-events: auto;
            z-index: 1000;
            overflow: hidden;
        }

        .chat-header {
            background: var(--card-bg);
            padding: 12px 16px;
            border-bottom: 1px solid var(--card-border);
            font-weight: 500;
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-primary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .chat-messages {
            flex-grow: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .msg {
            padding: 10px 12px;
            border-radius: 4px;
            font-size: 0.85rem;
            max-width: 85%;
            line-height: 1.5;
        }

        .msg.system {
            align-self: flex-start;
            background: var(--card-bg);
            border-left: 2px solid var(--text-secondary);
            color: var(--text-primary);
        }

        .msg.user {
            align-self: flex-end;
            background: var(--card-bg);
            border-right: 2px solid var(--accent-selection);
            color: var(--text-primary);
            text-align: right;
        }

        .chat-input-area {
            padding: 12px;
            border-top: 1px solid var(--card-border);
            display: flex;
            gap: 8px;
        }

        .chat-input {
            flex-grow: 1;
            background: var(--bg-color);
            border: 1px solid var(--card-border);
            border-radius: 4px;
            padding: 8px 12px;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
        }

        .chat-input:focus {
            outline: none;
            border-color: var(--text-secondary);
        }

        /* LAYOUT - MINIMAL */
        #graph-container {
            width: 100vw;
            height: 100vh;
        }

        #ui-layer {
            position: absolute;
            top: 24px;
            left: 24px;
            bottom: 24px;
            width: 320px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid var(--card-border);
            border-radius: 4px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        h1 {
            margin: 0;
            font-size: 0.9rem;
            font-weight: 500;
            text-transform: uppercase;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 16px;
            letter-spacing: 1px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h1 i {
            color: var(--text-secondary);
        }

        #vision-feed {
            flex-grow: 1;
            overflow-y: auto;
            padding-right: 8px;
        }

        .vision-card {
            border: 1px solid var(--card-border);
            margin-bottom: 12px;
            padding: 12px;
            background: var(--card-bg);
            border-left: 2px solid var(--accent-danger);
            border-radius: 4px;
            cursor: pointer;
            transition: border-color 0.15s;
        }

        .vision-card:hover {
            border-color: var(--text-secondary);
        }

        /* Risk Levels - Matte */
        .high-risk {
            color: var(--accent-danger);
            font-weight: 600;
            font-family: var(--mono-font);
        }

        .medium-risk {
            color: var(--accent-safe);
            font-family: var(--mono-font);
        }

        /* Scrollbar - Minimal */
        #vision-feed::-webkit-scrollbar {
            width: 4px;
        }

        #vision-feed::-webkit-scrollbar-track {
            background: transparent;
        }

        #vision-feed::-webkit-scrollbar-thumb {
            background: var(--card-border);
            border-radius: 2px;
        }

        .nav-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-top: 1px solid var(--card-border);
            padding-top: 16px;
        }

        button {
            width: 100%;
            padding: 10px 16px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            font-size: 0.8rem;
            border: 1px solid var(--card-border);
            background: var(--card-bg);
            color: var(--text-primary);
            border-radius: 4px;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.15s;
        }

        button:hover {
            border-color: var(--text-secondary);
            background: #1a1a1a;
        }

        .btn-alert {
            background: var(--accent-danger);
            border-color: var(--accent-danger);
            color: #000;
        }

        .btn-alert:hover {
            background: #dc2626;
            border-color: #dc2626;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--card-border);
            color: var(--text-secondary);
        }

        .btn-secondary:hover {
            border-color: var(--text-secondary);
            color: var(--text-primary);
        }

        .btn-green {
            background: var(--accent-safe);
            border-color: var(--accent-safe);
            color: #000;
        }
    </style>
</head>

<body>
    <!-- SIDE PANEL (UNIFIED) -->
    <div id="ui-layer">
        <div>
            <h1>
                <i class="fas fa-network-wired"></i> GNN MAIN
            </h1>
            <div style="font-size: 0.8em; color: var(--text-secondary); margin-top: 5px;">MADRID SECTOR | LIVE FEED
            </div>
        </div>

        <div id="vision-feed">
            <div style="padding: 20px; text-align: center; color: var(--text-secondary);">Initializing Neural Link...
            </div>
        </div>

        <div class="nav-section">
            <button class="btn-secondary" onclick="window.location.href='/analytics-dashboard'">
                <i class="fas fa-chart-pie"></i> VIEW ANALYTICS
            </button>

            <button class="btn-secondary" onclick="window.location.href='/map-view'">
                <i class="fas fa-map-marked-alt"></i> COMMAND MAP
            </button>

            <button class="btn-alert" onclick="triggerSimulation()">
                <i class="fas fa-bolt"></i> RUN SIMULATION
            </button>
        </div>
    </div>

    <!-- Chatbot Integration -->
    <div class="chat-fab" onclick="toggleChat()">
        <i class="fas fa-robot"></i>
    </div>

    <div class="chat-window" id="chat-window">
        <div class="chat-header">
            <span><i class="fas fa-brain"></i> PRECOG ASSISTANT</span>
            <i class="fas fa-times" style="cursor: pointer;" onclick="toggleChat()"></i>
        </div>
        <div class="chat-messages" id="chat-feed">
            <div class="msg system">GNN Neural Link Active.<br><i>System ready for inquiries.</i></div>
        </div>
        <div class="chat-input-area">
            <input type="text" class="chat-input" id="chat-input" placeholder="Query Neural Net..."
                onkeypress="handleKeyPress(event)">
            <button class="btn-green" style="width: auto; padding: 8px 12px; margin-bottom:0;" onclick="sendMessage()">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <div id="graph-container"></div>

    <script>
        const graphElem = document.getElementById('graph-container');
        let Graph = ForceGraph3D()(graphElem)
            .backgroundColor('#000000') // Pure black for stealth aesthetic
            .nodeRelSize(4) // Smaller, minimal nodes
            .nodeColor(node => {
                // Stealth palette: mostly grays, white for selection/danger
                if (node.in_analysis === false) return '#27272a'; // Zinc dark

                const g = node.group ? node.group.toLowerCase() : '';
                if (g === 'red' || g === 'vision' || g.includes('danger')) return '#ef4444'; // Matte red
                if (g === 'yellow' || g === 'location') return '#71717a'; // Medium gray
                if (g === 'blue' || g === 'citizen') return '#a1a1aa'; // Light gray
                if (g === 'green' || g === 'safe') return '#10b981'; // Matte emerald
                if (g === 'purple') return '#e4e4e7'; // Near white for hubs
                return '#52525b'; // Default zinc
            })
            .nodeLabel(node => `<span style="color: #e4e4e7; background: #121212; padding: 4px 8px; font-family: Inter, sans-serif; font-size: 12px; border: 1px solid #27272a;">${node.label || 'Node'}</span>`)
            .linkWidth(1) // Thin lines
            .linkColor(() => '#27272a') // Very faint gray links
            .linkOpacity(0.4) // Subtle connections
            .onNodeClick(node => {
                const distance = 40;
                const distRatio = 1 + distance / Math.hypot(node.x, node.y, node.z);
                Graph.cameraPosition(
                    { x: node.x * distRatio, y: node.y * distRatio, z: node.z * distRatio },
                    node,
                    3000
                );
            });

        // Configure forces AFTER Graph is created (proper way to set d3 forces)
        Graph.d3Force('link').distance(100);  // Longer links for spread
        Graph.d3Force('charge').strength(-200);  // Repulsion between nodes

        async function fetchGraphData() {
            try {
                const res = await fetch('/visions/graph?limit=300');
                const data = await res.json();

                // Only update if number of nodes changed to avoid constant resets
                const currentData = Graph.graphData();
                if (!currentData || currentData.nodes.length !== data.nodes.length) {
                    Graph.graphData(data);
                }
            } catch (e) { console.error("Error fetching graph:", e); }
        }

        async function fetchActiveVisions() {
            const feed = document.getElementById('vision-feed');
            try {
                const res = await fetch('/visions/active');
                const visions = await res.json();

                if (visions.length === 0) {
                    feed.innerHTML = "No active threats detected.";
                    return;
                }

                feed.innerHTML = visions.map(v => `
                    <div class="vision-card">
                        <div style="font-weight:bold;">${v.perpetrator.name} -> ${v.target.name}</div>
                        <div>Prob: <span class="${v.probability > 0.8 ? 'high-risk' : 'medium-risk'}">${(v.probability * 100).toFixed(1)}%</span></div>
                        <div style="font-size:0.8em; color:#888;">${new Date(v.timestamp).toLocaleTimeString()}</div>
                    </div>
                `).join('');

            } catch (e) { console.error("Error fetching visions:", e); }
        }

        async function triggerSimulation() {
            await fetch('/simulation/step', { method: 'POST' });
            fetchGraphData();
            fetchActiveVisions();
            addSystemMessage("Simulation Step Complete. Graph updated.");
        }

        /* CHATBOT LOGIC */
        function toggleChat() {
            const w = document.getElementById('chat-window');
            w.style.display = (w.style.display === 'none' || w.style.display === '') ? 'flex' : 'none';
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function addSystemMessage(text) {
            const feed = document.getElementById('chat-feed');
            feed.innerHTML += `<div class="msg system">${text}</div>`;
            feed.scrollTop = feed.scrollHeight;
        }

        function addUserMessage(text) {
            const feed = document.getElementById('chat-feed');
            feed.innerHTML += `<div class="msg user">${text}</div>`;
            feed.scrollTop = feed.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const txt = input.value.trim();
            if (!txt) return;

            addUserMessage(txt);
            input.value = '';

            const lower = txt.toLowerCase();

            // 1. Evasion Intent
            if (lower.includes("route") || lower.includes("escape")) {
                addSystemMessage("Redirecting to Command Map for Evasion Protocol...");
                setTimeout(() => window.location.href = '/map-view', 1500);
                return;
            }

            // 2. Explanation Intent
            if (lower.includes("why") || lower.includes("danger")) {
                addSystemMessage("Accessing XAI Subsystem...");
                try {
                    const res = await fetch("/evasion/explain-risk?hour=2&weather=Clear&patrols=5");
                    const data = await res.json();

                    const responseHTML = `
                        <strong>SHAP Analysis:</strong><br>
                        Risk Probability: ${(data.base_risk * 100).toFixed(1)}%<br>
                        Critical Factors: ${data.top_factors.join(", ")}
                    `;
                    addSystemMessage(responseHTML);
                } catch (e) {
                    addSystemMessage("Error connecting to Forensic Module.");
                }
                return;
            }

            addSystemMessage("Command not recognized. Protocols: 'Escape', 'Why is this dangerous?'.");
        }

        fetchGraphData();
        fetchActiveVisions();
        setInterval(fetchActiveVisions, 5000);
        setInterval(fetchGraphData, 30000); // Fetch graph only every 30s
    </script>
</body>

</html>
