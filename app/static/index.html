<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pre-Crime Division | Dashboard</title>
    <script src="//unpkg.com/3d-force-graph"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            background-color: #000;
            color: #00ff00;
            font-family: 'Inter', monospace;
            overflow: hidden;
        }

        /* CHATBOT STYLES (MATCHING MAP VIEW) */
        .chat-fab {
            position: absolute;
            bottom: 30px;
            right: 40px;
            width: 60px;
            height: 60px;
            background: #00ff00;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            color: #000;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.4);
            transition: all 0.3s ease;
            pointer-events: auto;
            z-index: 1000;
        }

        .chat-fab:hover {
            transform: scale(1.1);
        }

        .chat-window {
            position: absolute;
            bottom: 100px;
            right: 40px;
            width: 350px;
            height: 500px;
            background: rgba(0, 20, 0, 0.95);
            border: 1px solid #00ff00;
            backdrop-filter: blur(16px);
            border-radius: 12px;
            display: none;
            flex-direction: column;
            pointer-events: auto;
            z-index: 1000;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
        }

        .chat-header {
            background: rgba(0, 255, 0, 0.1);
            padding: 15px;
            border-bottom: 1px solid rgba(0, 255, 0, 0.3);
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #00ff00;
        }

        .chat-messages {
            flex-grow: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .msg {
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            max-width: 80%;
            line-height: 1.4;
        }

        .msg.system {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.1);
            border-left: 3px solid #00ff00;
            color: #ccffcc;
        }

        .msg.user {
            align-self: flex-end;
            background: rgba(0, 255, 0, 0.2);
            border-right: 3px solid #00ff00;
            color: #00ff00;
            text-align: right;
        }

        .chat-input-area {
            padding: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: 10px;
        }

        .chat-input {
            flex-grow: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 255, 0, 0.2);
            border-radius: 4px;
            padding: 8px;
            color: #00ff00;
            font-family: monospace;
        }

        .chat-input:focus {
            outline: none;
            border-color: #00ff00;
        }

        /* LAYOUT REFACTOR */
        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.9) 0%, transparent 100%);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            box-sizing: border-box;
            z-index: 20;
            pointer-events: none;
            /* Let clicks pass through, but buttons will enable pointer-events */
        }

        .brand {
            font-size: 1.5rem;
            font-weight: 700;
            color: #00ff00;
            text-shadow: 0 0 10px #00ff00;
        }

        .nav-buttons {
            pointer-events: auto;
            display: flex;
        }

        #ui-layer {
            position: absolute;
            top: 100px;
            /* Below top bar */
            left: 20px;
            bottom: 20px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #00ff00;
            padding: 20px;
            width: 300px;
            display: flex;
            flex-direction: column;
        }

        #vision-feed {
            flex-grow: 1;
            overflow-y: auto;
            margin-top: 10px;
            padding-right: 5px;
        }

        /* Scrollbar styling for cyber look */
        #vision-feed::-webkit-scrollbar {
            width: 5px;
        }

        #vision-feed::-webkit-scrollbar-track {
            background: #001100;
        }

        #vision-feed::-webkit-scrollbar-thumb {
            background: #00ff00;
        }

        button {
            padding: 10px 15px;
            cursor: pointer;
            font-family: 'Inter', monospace;
            font-weight: bold;
            border: 1px solid #00ff00;
            background: rgba(0, 20, 0, 0.8);
            color: #00ff00;
            margin-left: 10px;
            transition: all 0.2s;
        }

        button:hover {
            background: #00ff00;
            color: black;
            box-shadow: 0 0 15px #00ff00;
        }
    </style>
</head>

<body>
    <!-- TOP NAVIGATION BAR -->
    <div class="top-bar">
        <div class="brand">
            <i class="fas fa-network-wired"></i> GNN CORE <span style="opacity: 0.5; font-size: 0.8em;">| MAIN
                NODE</span>
        </div>
        <div class="nav-buttons">
            <button onclick="window.location.href='/analytics-dashboard'">
                <i class="fas fa-chart-pie"></i> ANALYTICS
            </button>
            <button onclick="window.location.href='/map-view'">
                <i class="fas fa-map-marked-alt"></i> COMMAND MAP
            </button>
        </div>
    </div>

    <!-- SIDE PANEL (VISIONS ONLY) -->
    <div id="ui-layer">
        <h1 style="margin: 0; font-size: 1.2em; border-bottom: 1px solid #00ff00; padding-bottom: 10px;">
            <i class="fas fa-eye"></i> ACTIVE VISIONS
        </h1>

        <div id="vision-feed">
            No active threats detected.
        </div>

        <div style="margin-top: 10px; border-top: 1px solid #333; padding-top: 10px;">
            <!-- Keep Simulation button here for quick access or move to top? Let's keep it here but styled smaller or moved. 
                  Actually, moving Simulation to side panel (Action) makes sense. -->
            <button style="width: 100%; margin: 0; background: #aa0000; border-color: #ff0000; color: white;"
                onclick="triggerSimulation()">
                <i class="fas fa-bolt"></i> RUN SIMULATION
            </button>
        </div>
    </div>
    </div>

    <!-- Chatbot Integration -->
    <div class="chat-fab" onclick="toggleChat()">
        <i class="fas fa-robot"></i>
    </div>

    <div class="chat-window" id="chat-window">
        <div class="chat-header">
            <span><i class="fas fa-brain"></i> PRECOG ASSISTANT</span>
            <i class="fas fa-times" style="cursor: pointer;" onclick="toggleChat()"></i>
        </div>
        <div class="chat-messages" id="chat-feed">
            <div class="msg system">GNN Neural Link Active.<br><i>System ready for inquiries.</i></div>
        </div>
        <div class="chat-input-area">
            <input type="text" class="chat-input" id="chat-input" placeholder="Query Neural Net..."
                onkeypress="handleKeyPress(event)">
            <button class="btn-green" style="width: auto; padding: 8px 12px; margin-bottom:0;" onclick="sendMessage()">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>
    <div id="graph-container"></div>

    <script>
        const graphElem = document.getElementById('graph-container');
        let Graph = ForceGraph3D()(graphElem)
            .backgroundColor('#000000')
            .nodeAutoColorBy('group')
            .nodeLabel(node => `${node.label} (${node.type})`)
            .linkWidth(link => link.value > 0.5 ? 2 : 1)
            .onNodeClick(node => {
                const distance = 40;
                const distRatio = 1 + distance / Math.hypot(node.x, node.y, node.z);
                Graph.cameraPosition(
                    { x: node.x * distRatio, y: node.y * distRatio, z: node.z * distRatio },
                    node,
                    3000
                );
            });

        async function fetchGraphData() {
            try {
                const res = await fetch('/visions/graph?limit=300');
                const data = await res.json();
                Graph.graphData(data);
            } catch (e) { console.error("Error fetching graph:", e); }
        }

        async function fetchActiveVisions() {
            const feed = document.getElementById('vision-feed');
            try {
                const res = await fetch('/visions/active');
                const visions = await res.json();

                if (visions.length === 0) {
                    feed.innerHTML = "No active threats detected.";
                    return;
                }

                feed.innerHTML = visions.map(v => `
                    <div class="vision-card">
                        <div style="font-weight:bold;">${v.perpetrator.name} -> ${v.target.name}</div>
                        <div>Prob: <span class="${v.probability > 0.8 ? 'high-risk' : 'medium-risk'}">${(v.probability * 100).toFixed(1)}%</span></div>
                        <div style="font-size:0.8em; color:#888;">${new Date(v.timestamp).toLocaleTimeString()}</div>
                    </div>
                `).join('');

            } catch (e) { console.error("Error fetching visions:", e); }
        }

        async function triggerSimulation() {
            await fetch('/simulation/step', { method: 'POST' });
            fetchGraphData();
            fetchActiveVisions();
            addSystemMessage("Simulation Step Complete. Graph updated.");
        }

        /* CHATBOT LOGIC */
        function toggleChat() {
            const w = document.getElementById('chat-window');
            w.style.display = (w.style.display === 'none' || w.style.display === '') ? 'flex' : 'none';
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function addSystemMessage(text) {
            const feed = document.getElementById('chat-feed');
            feed.innerHTML += `<div class="msg system">${text}</div>`;
            feed.scrollTop = feed.scrollHeight;
        }

        function addUserMessage(text) {
            const feed = document.getElementById('chat-feed');
            feed.innerHTML += `<div class="msg user">${text}</div>`;
            feed.scrollTop = feed.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const txt = input.value.trim();
            if (!txt) return;

            addUserMessage(txt);
            input.value = '';

            const lower = txt.toLowerCase();

            // 1. Evasion Intent
            if (lower.includes("route") || lower.includes("escape")) {
                addSystemMessage("Redirecting to Command Map for Evasion Protocol...");
                setTimeout(() => window.location.href = '/map-view', 1500);
                return;
            }

            // 2. Explanation Intent
            if (lower.includes("why") || lower.includes("danger")) {
                addSystemMessage("Accessing XAI Subsystem...");
                try {
                    const res = await fetch("/evasion/explain-risk?hour=2&weather=Clear&patrols=5");
                    const data = await res.json();

                    const responseHTML = `
                        <strong>SHAP Analysis:</strong><br>
                        Risk Probability: ${(data.base_risk * 100).toFixed(1)}%<br>
                        Critical Factors: ${data.top_factors.join(", ")}
                    `;
                    addSystemMessage(responseHTML);
                } catch (e) {
                    addSystemMessage("Error connecting to Forensic Module.");
                }
                return;
            }

            addSystemMessage("Command not recognized. Protocols: 'Escape', 'Why is this dangerous?'.");
        }

        fetchGraphData();
        fetchActiveVisions();
        setInterval(fetchActiveVisions, 5000);
    </script>
</body>

</html>
