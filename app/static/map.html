<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pre-Crime Unit | Command Dashboard</title>

    <!-- Dependencies -->
    <script src="https://unpkg.com/deck.gl@8.9.0/dist.min.js"></script>
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Secrets -->
    <script src="/static/config.js"></script>

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-red: #f87171;
            --accent-green: #4ade80;
            --accent-purple: #a855f7;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        #map-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
        }

        .overlay-ui {
            position: absolute;
            z-index: 10;
            pointer-events: none;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .top-bar {
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.9) 0%, transparent 100%);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: auto;
        }

        .brand {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand i {
            color: var(--accent-blue);
            filter: drop-shadow(0 0 8px var(--accent-blue));
        }

        .sidebar {
            position: absolute;
            left: 40px;
            top: 100px;
            bottom: 40px;
            width: 320px;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .glass-panel {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(12px);
            border-radius: 12px;
            padding: 20px;
        }

        .panel-header {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            margin-bottom: 15px;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 8px;
        }

        .vision-item {
            background: rgba(255, 255, 255, 0.03);
            border-left: 3px solid var(--accent-red);
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 0 4px 4px 0;
            cursor: pointer;
            transition: all 0.2s;
        }

        .vision-item:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .vision-prob {
            float: right;
            font-weight: bold;
            color: var(--accent-red);
        }

        .control-btn {
            width: 100%;
            padding: 12px;
            background: var(--accent-blue);
            color: #000;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .control-btn.secondary {
            background: transparent;
            border: 1px solid var(--accent-blue);
            color: var(--accent-blue);
        }

        .control-btn:hover {
            opacity: 0.9;
        }

        .status-bar {
            position: absolute;
            bottom: 30px;
            right: 40px;
            pointer-events: auto;
        }

        .live-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: var(--accent-red);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent-red);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }

            100% {
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <div id="map-container"></div>
    <div id="tooltip"
        style="position: absolute; z-index: 100; pointer-events: none; padding: 10px; background: rgba(0,0,0,0.8); border-radius: 4px; display: none;">
    </div>

    <div class="overlay-ui">
        <div class="top-bar">
            <div class="brand">
                <i class="fas fa-eye"></i> PRE-CRIME UNIT <span style="opacity: 0.5; font-weight: 300;"> | MADRID
                    SECTOR</span>
            </div>
            <div>
                <button class="control-btn secondary" style="width: auto; margin-right: 10px;"
                    onclick="window.location.href='/'">
                    <i class="fas fa-network-wired"></i> NEURAL NET
                </button>
                <button class="control-btn secondary" style="width: auto;"
                    onclick="window.location.href='/analytics-dashboard'">
                    <i class="fas fa-chart-pie"></i> ANALYTICS DIVISION
                </button>
            </div>
        </div>

        <div class="sidebar">
            <div class="glass-panel" style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column;">
                <div class="panel-header">Active Predictions <span class="live-indicator"></span></div>
                <div id="visions-list" style="overflow-y: auto; flex-grow: 1;">
                    <div style="text-align: center; color: var(--text-secondary); padding: 20px;">Scanning...</div>
                </div>
            </div>

            <div class="glass-panel">
                <div class="panel-header">System Controls</div>
                <button class="control-btn" onclick="triggerSimulation()">
                    <i class="fas fa-bolt"></i> RUN SIMULATION STEP
                </button>
                <button class="control-btn" style="background: var(--accent-purple); color: white;"
                    onclick="triggerEscapeRouting()">
                    <i class="fas fa-shield-alt"></i> GENERATE EVASION ROUTE
                </button>
                <div style="font-size: 0.8rem; color: var(--text-secondary); text-align: center; margin-top: 10px;">
                    Next update in: <span id="countdown">--</span>
                </div>
            </div>
        </div>

        <div class="status-bar glass-panel">
            <i class="fas fa-map-marked-alt"></i> Viewing: <b>Madrid Central</b> | Lat: 40.41 | Lon: -3.70
        </div>
    </div>

    <script>
        const { DeckGL, HexagonLayer, ScatterplotLayer, ArcLayer } = deck;

        let deckgl;
        let escapeRoutes = [];
        let heatData = [];
        let visionsData = [];

        async function initMap() {
            const [heatBtn, visions] = await Promise.all([
                fetch('/map/heatmap').then(r => r.json()),
                fetch('/map/visions').then(r => r.json())
            ]);
            heatData = heatBtn;
            visionsData = visions;

            updateLayers();
            renderVisionsList(visionsData);
        }

        function updateLayers() {
            const layers = [
                new HexagonLayer({
                    id: 'heatmap-layer',
                    data: heatData,
                    pickable: true,
                    extruded: true,
                    radius: 200,
                    elevationScale: 4,
                    getPosition: d => d.coordinates,
                    getElevationWeight: d => d.weight,
                    colorRange: [
                        [1, 152, 189], [73, 227, 206], [216, 254, 181],
                        [254, 237, 177], [254, 173, 154], [209, 55, 78]
                    ],
                }),
                new ScatterplotLayer({
                    id: 'visions-layer',
                    data: visionsData,
                    pickable: true,
                    opacity: 0.8,
                    stroked: true,
                    filled: true,
                    radiusScale: 6,
                    radiusMinPixels: 5,
                    getPosition: d => [d.lon, d.lat],
                    getFillColor: [255, 0, 0],
                    getLineColor: [255, 255, 255],
                    getLineWidth: 1,
                }),
                new ArcLayer({
                    id: 'escape-routes-layer',
                    data: escapeRoutes,
                    pickable: true,
                    getWidth: 4,
                    getSourcePosition: d => d.source,
                    getTargetPosition: d => d.target,
                    getSourceColor: [0, 255, 255, 200],
                    getTargetColor: [168, 85, 247, 200],
                })
            ];

            if (!deckgl) {
                deckgl = new DeckGL({
                    container: 'map-container',
                    mapStyle: 'mapbox://styles/mapbox/dark-v11',
                    mapboxApiAccessToken: MAPBOX_TOKEN,
                    initialViewState: MADRID_VIEW_STATE,
                    controller: true,
                    layers: layers,
                    getTooltip: ({ object }) => object && {
                        html: object.location_name ?
                            `<b>${object.location_name}</b><br>Risk: ${(object.probability * 100).toFixed(1)}%` :
                            `Density: ${object.elevationValue || 'N/A'}`
                    }
                });
            } else {
                deckgl.setProps({ layers: layers });
            }
        }

        async function triggerEscapeRouting() {
            const btn = document.querySelector('button[onclick="triggerEscapeRouting()"]');
            btn.innerHTML = '<i class="fas fa-route fa-spin"></i> CALCULATING HPC PATH...';

            try {
                const res = await fetch('/evasion/route?origin_id=LOC_SOL&destination_id=LOC_RETIRO');
                if (!res.ok) throw new Error("Route calculation failed");
                const data = await res.json();

                escapeRoutes = [];
                for (let i = 0; i < data.path.length - 1; i++) {
                    escapeRoutes.push({
                        source: [data.path[i].lon, data.path[i].lat],
                        target: [data.path[i + 1].lon, data.path[i + 1].lat]
                    });
                }

                updateLayers();
                alert(`Path Generated via HPC Optimization (Numba JIT). Total Risk: ${data.total_risk_score.toFixed(2)}`);
            } catch (e) {
                console.error(e);
                alert("HPC Error: " + e.message + ". Try running a Simulation Step first to populate city nodes.");
            }
            btn.innerHTML = '<i class="fas fa-shield-alt"></i> GENERATE EVASION ROUTE';
        }

        function renderVisionsList(visions) {
            const container = document.getElementById('visions-list');
            container.innerHTML = '';
            if (visions.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: var(--text-secondary); margin-top:20px;">No Active Threats</div>';
                return;
            }
            visions.forEach(v => {
                const el = document.createElement('div');
                el.className = 'vision-item';
                el.innerHTML = `
                    <span class="vision-prob">${(v.probability * 100).toFixed(0)}%</span>
                    <div style="font-weight: 600;">${v.location_name || 'Unknown'}</div>
                    <div style="font-size: 0.8rem; color: #aaa;">ID: ${v.id}</div>
                `;
                el.onclick = () => {
                    deckgl.setProps({
                        initialViewState: {
                            longitude: v.lon, latitude: v.lat, zoom: 15,
                            transitionDuration: 1000, pitch: 60
                        }
                    });
                };
                container.appendChild(el);
            });
        }

        async function triggerSimulation() {
            const btn = document.querySelector('button[onclick="triggerSimulation()"]');
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> PROCESSING...';
            try {
                await fetch('/simulation/step', { method: 'POST' });
                initMap();
            } catch (e) { console.error(e); }
            btn.innerHTML = '<i class="fas fa-bolt"></i> RUN SIMULATION STEP';
        }

        initMap();
    </script>
</body>

</html>
