<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pre-Crime Unit | Command Dashboard</title>

    <!-- Dependencies -->
    <script src="https://unpkg.com/deck.gl@8.9.0/dist.min.js"></script>
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Secrets -->
    <script src="/static/config.js"></script>

    <style>
        :root {
            /* STEALTH ENTERPRISE PALETTE */
            --bg-color: #000000;
            --card-bg: #121212;
            --card-border: #27272a;
            --text-primary: #e4e4e7;
            --text-secondary: #71717a;
            --accent-selection: #ffffff;
            --accent-danger: #ef4444;
            --accent-safe: #10b981;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        #map-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
        }

        .overlay-ui {
            position: absolute;
            z-index: 10;
            pointer-events: none;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .top-bar {
            background: rgba(0, 0, 0, 0.9);
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: auto;
            border-bottom: 1px solid var(--card-border);
        }

        .brand {
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand i {
            color: var(--text-secondary);
        }

        .sidebar {
            position: absolute;
            left: 40px;
            top: 100px;
            bottom: 40px;
            width: 320px;
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .glass-panel {
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid var(--card-border);
            border-radius: 4px;
            padding: 16px;
        }

        .panel-header {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            margin-bottom: 15px;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 8px;
        }

        .vision-item {
            background: var(--card-bg);
            border-left: 2px solid var(--accent-danger);
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 0 4px 4px 0;
            cursor: pointer;
            transition: border-color 0.15s;
        }

        .vision-item:hover {
            border-color: var(--text-secondary);
        }

        .vision-prob {
            float: right;
            font-weight: 600;
            color: var(--accent-danger);
            font-family: 'JetBrains Mono', monospace;
        }

        .control-btn {
            width: 100%;
            padding: 10px;
            background: var(--card-bg);
            color: var(--text-primary);
            border: 1px solid var(--card-border);
            border-radius: 4px;
            font-weight: 500;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            margin-top: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: border-color 0.15s;
        }

        .control-btn:hover {
            border-color: var(--text-secondary);
        }

        .control-btn.secondary {
            background: transparent;
            color: var(--text-secondary);
        }

        .control-btn.secondary:hover {
            color: var(--text-primary);
        }


        .status-bar {
            position: absolute;
            bottom: 30px;
            right: 40px;
            pointer-events: auto;
        }

        .live-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--accent-safe);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }

            100% {
                opacity: 1;
            }
        }

        /* CHATBOT - STEALTH STYLE */
        .chat-fab {
            position: absolute;
            bottom: 30px;
            right: 40px;
            width: 48px;
            height: 48px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            color: var(--text-primary);
            cursor: pointer;
            transition: border-color 0.15s;
            pointer-events: auto;
            z-index: 1000;
        }

        .chat-fab:hover {
            border-color: var(--text-secondary);
        }

        .chat-window {
            position: absolute;
            bottom: 90px;
            right: 40px;
            width: 320px;
            height: 450px;
            background: var(--bg-color);
            border: 1px solid var(--card-border);
            border-radius: 4px;
            display: none;
            flex-direction: column;
            pointer-events: auto;
            z-index: 1000;
            overflow: hidden;
        }

        .chat-header {
            background: var(--card-bg);
            padding: 12px 16px;
            border-bottom: 1px solid var(--card-border);
            font-weight: 500;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-messages {
            flex-grow: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .msg {
            padding: 10px 12px;
            border-radius: 4px;
            font-size: 0.85rem;
            max-width: 85%;
            line-height: 1.5;
        }

        .msg.system {
            align-self: flex-start;
            background: var(--card-bg);
            border-left: 2px solid var(--text-secondary);
            color: var(--text-primary);
        }

        .msg.user {
            align-self: flex-end;
            background: var(--card-bg);
            border-right: 2px solid var(--accent-selection);
            color: var(--text-primary);
            text-align: right;
        }

        .chat-input-area {
            padding: 12px;
            border-top: 1px solid var(--card-border);
            display: flex;
            gap: 8px;
        }

        .chat-input {
            flex-grow: 1;
            background: var(--bg-color);
            border: 1px solid var(--card-border);
            border-radius: 4px;
            padding: 8px 12px;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
        }

        .chat-input:focus {
            outline: none;
            border-color: var(--text-secondary);
        }
    </style>
</head>

<body>

    <div id="map-container"></div>
    <div id="tooltip"
        style="position: absolute; z-index: 100; pointer-events: none; padding: 10px; background: rgba(0,0,0,0.8); border-radius: 4px; display: none;">
    </div>

    <div class="overlay-ui">
        <div class="top-bar">
            <div class="brand">
                <i class="fas fa-eye"></i> PRE-CRIME UNIT <span style="opacity: 0.5; font-weight: 300;"> | MADRID
                    SECTOR</span>
            </div>
            <div>
                <button class="control-btn secondary"
                    style="width: auto; margin-right: 10px; z-index: 100; position: relative;"
                    onclick="window.location.href='/'">
                    <i class="fas fa-project-diagram"></i> GNN NETWORK
                </button>
                <button class="control-btn secondary" style="width: auto;"
                    onclick="window.location.href='/analytics-dashboard'">
                    <i class="fas fa-chart-pie"></i> ANALYTICS DIVISION
                </button>
            </div>
        </div>

        <div class="sidebar">
            <div class="glass-panel" style="flex-grow: 1; overflow: hidden; display: flex; flex-direction: column;">
                <div class="panel-header">Active Predictions <span class="live-indicator"></span></div>
                <div id="visions-list" style="overflow-y: auto; flex-grow: 1;">
                    <div style="text-align: center; color: var(--text-secondary); padding: 20px;">Scanning...</div>
                </div>
            </div>

            <div class="glass-panel">
                <div class="panel-header">System Controls</div>
                <button class="control-btn" onclick="triggerSimulation()">
                    <i class="fas fa-bolt"></i> RUN SIMULATION STEP
                </button>
                <button class="control-btn" style="background: var(--accent-purple); color: white;"
                    onclick="triggerEscapeRouting()">
                    <i class="fas fa-shield-alt"></i> GENERATE EVASION ROUTE
                </button>
                <div style="font-size: 0.8rem; color: var(--text-secondary); text-align: center; margin-top: 10px;">
                    Next update in: <span id="countdown">--</span>
                </div>
            </div>
        </div>

        <!-- Replaced Status Bar with Chatbot UI -->
        <!-- Chat FAB -->
        <div class="chat-fab" onclick="toggleChat()">
            <i class="fas fa-robot"></i>
        </div>

        <!-- Chat Window -->
        <div class="chat-window" id="chat-window">
            <div class="chat-header">
                <span><i class="fas fa-brain"></i> PRECOG ASSISTANT</span>
                <i class="fas fa-times" style="cursor: pointer;" onclick="toggleChat()"></i>
            </div>
            <div class="chat-messages" id="chat-feed">
                <div class="msg system">Neural Link Established. System ready for inquiries.<br><i>Try: "Why is this
                        zone dangerous?"</i></div>
            </div>
            <div class="chat-input-area">
                <input type="text" class="chat-input" id="chat-input" placeholder="Type command..."
                    onkeypress="handleKeyPress(event)">
                <button class="control-btn" style="width: auto; padding: 8px 12px; margin-top:0;"
                    onclick="sendMessage()">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>

        <div class="status-bar glass-panel" style="right: 120px;">
            <i class="fas fa-map-marked-alt"></i> Viewing: <b>Madrid Central</b> | Lat: 40.41 | Lon: -3.70
        </div>
    </div>

    <script>
        const { DeckGL, HexagonLayer, ScatterplotLayer, ArcLayer } = deck;

        let deckgl;
        let escapeRoutes = [];
        let heatData = [];
        let visionsData = [];

        async function initMap() {
            const [heatBtn, visions] = await Promise.all([
                fetch('/map/heatmap').then(r => r.json()),
                fetch('/map/visions').then(r => r.json())
            ]);
            heatData = heatBtn;
            visionsData = visions;

            updateLayers();
            renderVisionsList(visionsData);
        }

        function updateLayers() {
            const layers = [
                new HexagonLayer({
                    id: 'heatmap-layer',
                    data: heatData,
                    pickable: true,
                    extruded: true,
                    radius: 300,
                    elevationScale: 2,
                    elevationRange: [0, 800],
                    getPosition: d => d.coordinates,
                    getElevationWeight: d => d.weight,
                    getColorWeight: d => d.weight,
                    // Force re-render on data update
                    updateTriggers: {
                        getElevationWeight: Date.now(),
                        getColorWeight: Date.now()
                    },
                    // Data colors: green-to-red heat scale for clarity
                    colorRange: [
                        [16, 185, 129],  // #10b981 emerald (low risk)
                        [34, 197, 94],   // #22c55e green
                        [250, 204, 21],  // #facc15 yellow
                        [251, 146, 60],  // #fb923c orange
                        [239, 68, 68],   // #ef4444 red (high risk)
                        [220, 38, 38]    // #dc2626 dark red (critical)
                    ],
                }),
                new ScatterplotLayer({
                    id: 'visions-layer',
                    data: visionsData,
                    pickable: true,
                    opacity: 0.9,
                    stroked: true,
                    filled: true,
                    radiusScale: 4,
                    radiusMinPixels: 4,
                    getPosition: d => [d.lon, d.lat],
                    getFillColor: [239, 68, 68],   // #ef4444 matte red
                    getLineColor: [255, 255, 255], // white stroke
                    getLineWidth: 1,
                }),
                new ArcLayer({
                    id: 'escape-routes-layer',
                    data: escapeRoutes,
                    pickable: true,
                    getWidth: 2,  // Thin elegant lines
                    getSourcePosition: d => d.source,
                    getTargetPosition: d => d.target,
                    getSourceColor: [228, 228, 231, 180], // #e4e4e7 near white
                    getTargetColor: [113, 113, 122, 180], // #71717a gray
                })
            ];

            if (!deckgl) {
                deckgl = new DeckGL({
                    container: 'map-container',
                    mapStyle: MAP_STYLE, // Use Carto (free) instead of Mapbox
                    initialViewState: MADRID_VIEW_STATE,
                    controller: true,
                    layers: layers,
                    getTooltip: ({ object }) => object && {
                        html: object.location_name ?
                            `<b>${object.location_name}</b><br>Risk: ${(object.probability * 100).toFixed(1)}%` :
                            `Density: ${object.elevationValue || 'N/A'}`
                    }
                });
            } else {
                deckgl.setProps({ layers: layers });
            }
        }

        async function triggerEscapeRouting() {
            const btn = document.querySelector('button[onclick="triggerEscapeRouting()"]');
            btn.innerHTML = '<i class="fas fa-route fa-spin"></i> CALCULATING HPC PATH...';

            try {
                const res = await fetch('/evasion/route?origin_id=LOC_SOL&destination_id=LOC_RETIRO');
                if (!res.ok) throw new Error("Route calculation failed");
                const data = await res.json();

                escapeRoutes = [];
                for (let i = 0; i < data.path.length - 1; i++) {
                    escapeRoutes.push({
                        source: [data.path[i].lon, data.path[i].lat],
                        target: [data.path[i + 1].lon, data.path[i + 1].lat]
                    });
                }

                updateLayers();
                alert(`Path Generated via HPC Optimization (Numba JIT). Total Risk: ${data.total_risk_score.toFixed(2)}`);
            } catch (e) {
                console.error(e);
                alert("HPC Error: " + e.message + ". Try running a Simulation Step first to populate city nodes.");
            }
            btn.innerHTML = '<i class="fas fa-shield-alt"></i> GENERATE EVASION ROUTE';
        }

        function renderVisionsList(visions) {
            const container = document.getElementById('visions-list');
            container.innerHTML = '';
            if (visions.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: var(--text-secondary); margin-top:20px;">No Active Threats</div>';
                return;
            }
            visions.forEach(v => {
                const el = document.createElement('div');
                el.className = 'vision-item';
                el.innerHTML = `
                    <span class="vision-prob">${(v.probability * 100).toFixed(0)}%</span>
                    <div style="font-weight: 600;">${v.location_name || 'Unknown'}</div>
                    <div style="font-size: 0.8rem; color: #aaa;">ID: ${v.id}</div>
                `;
                el.onclick = () => {
                    deckgl.setProps({
                        initialViewState: {
                            longitude: v.lon, latitude: v.lat, zoom: 15,
                            transitionDuration: 1000, pitch: 60
                        }
                    });
                };
                container.appendChild(el);
            });
        }

        async function triggerSimulation() {
            const btn = document.querySelector('button[onclick="triggerSimulation()"]');
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> PROCESSING...';
            try {
                await fetch('/simulation/step', { method: 'POST' });
                initMap();
                addSystemMessage("Simulation Step Complete. Data refreshed.");
            } catch (e) { console.error(e); }
            btn.innerHTML = '<i class="fas fa-bolt"></i> RUN SIMULATION STEP';
        }

        /* CHATBOT LOGIC */
        function toggleChat() {
            const w = document.getElementById('chat-window');
            w.style.display = (w.style.display === 'none' || w.style.display === '') ? 'flex' : 'none';
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function addSystemMessage(text) {
            const feed = document.getElementById('chat-feed');
            feed.innerHTML += `<div class="msg system">${text}</div>`;
            feed.scrollTop = feed.scrollHeight;
        }

        function addUserMessage(text) {
            const feed = document.getElementById('chat-feed');
            feed.innerHTML += `<div class="msg user">${text}</div>`;
            feed.scrollTop = feed.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const txt = input.value.trim();
            if (!txt) return;

            addUserMessage(txt);
            input.value = '';

            // Intent Recognition
            const lower = txt.toLowerCase();

            // 1. Evasion Intent
            if (lower.includes("route") || lower.includes("escape") || lower.includes("path")) {
                addSystemMessage("Acknowledged. Calculating optimal evasion route via HPC...");
                triggerEscapeRouting();
                return;
            }

            // 2. Explanation Intent
            if (lower.includes("why") || lower.includes("danger") || lower.includes("risk")) {
                addSystemMessage("Accessing XAI Subsystem...");
                try {
                    // Fetch real explanation from backend
                    // Dummy params for demo
                    const res = await fetch("/evasion/explain-risk?hour=2&weather=Clear&patrols=5");
                    const data = await res.json();

                    const responseHTML = `
                        <strong>SHAP Analysis Detected:</strong><br>
                        Risk Probability: ${(data.base_risk * 100).toFixed(1)}%<br>
                        Critical Factors: ${data.top_factors.join(", ")}<br>
                        <span style="font-size:0.8em; color:var(--accent-green);">${data.shap_summary}</span>
                    `;
                    addSystemMessage(responseHTML);
                } catch (e) {
                    addSystemMessage("Error connecting to Forensic Module.");
                }
                return;
            }

            // 3. Fallback
            addSystemMessage("Command not recognized. Protocols: 'Generate Route', 'Why is this dangerous?'.");
        }

        initMap();
    </script>
</body>

</html>
